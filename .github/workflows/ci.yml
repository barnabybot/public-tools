name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - run: python3 scripts/check_binary_ratchet.py
      - run: python3 scripts/check_code_comments.py --ratchet
      - run: python3 -m py_compile scripts/*.py
      - name: Shell syntax checks
        run: |
          for f in wallpaper-calendar/*.sh .agents/skills/verify-public-tools/scripts/wallpaper-shot; do
            bash -n "$f"
          done
