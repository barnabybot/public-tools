<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Year overview</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#111;color:#eee;font-family:"Helvetica Neue",sans-serif;padding:1.5rem 2rem 3rem}
  .controls{display:flex;gap:1.5rem;align-items:center;margin-bottom:1.2rem}
  .controls span{font-size:.8rem;color:#888}
  button{background:none;border:1px solid #444;color:#bbb;font:inherit;font-size:.8rem;
    padding:.3rem .7rem;cursor:pointer}
  button.on{border-color:#eee;color:#fff}
  input{background:none;border:1px solid #444;color:#eee;font:inherit;font-size:.8rem;
    padding:.3rem .5rem;width:3.2rem}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2rem}
  figure iframe{width:100%;aspect-ratio:16/9;border:0;display:block;pointer-events:none}
  figcaption{font-size:.75rem;color:#999;margin-top:.4rem}
</style>
</head>
<body>
<div class="controls">
  <span>Day</span><input id="day" type="number" min="1" max="31">
  <span>Style</span>
  <button data-style="gradient" class="on">gradient</button>
  <button data-style="solid">solid</button>
</div>
<div class="grid" id="grid"></div>

<script>
const MONTHS=["January","February","March","April","May","June",
              "July","August","September","October","November","December"];
let day = new Date().getDate(), style = "gradient";
const grid = document.getElementById("grid");
for(let m=1;m<=12;m++){
  const f=document.createElement("figure");
  f.innerHTML=`<iframe data-month="${m}"></iframe><figcaption>${MONTHS[m-1]}</figcaption>`;
  grid.appendChild(f);
}
const dayInput=document.getElementById("day");
dayInput.value=day;
function refresh(){
  document.querySelectorAll("iframe").forEach(f=>{
    f.src=`wallpaper.html?year=2026&month=${f.dataset.month}&day=${day}&style=${style}`;
  });
  document.querySelectorAll("[data-style]").forEach(b=>b.classList.toggle("on",b.dataset.style===style));
}
document.addEventListener("click",e=>{
  if(e.target.dataset.style){ style=e.target.dataset.style; refresh(); }
});
dayInput.addEventListener("change",()=>{ day=Math.max(1,Math.min(31,+dayInput.value||1)); refresh(); });
refresh();
</script>
</body>
</html>
